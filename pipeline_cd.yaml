
 parameters: # if parameter not defined we ll see issue
  - name: steps # got an issue when no hyphen in the name
    displayName: 'Steps to add'
    type: stepList
    default: [] 
 
 jobs:
  - job: Deploy
    displayName: 'terraform plan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
          - ${{each step in parameters.steps}}: #useful to add steps in the future without changing the template
            -  ${{each pair in step}}: 
                   ${{pair.key}}:${{pair.value}}
          - task: azurekeyvault@2
            displayName: 'Azure Key Vault: Fetch secrets'
            inputs:
              connectedServiceName: 'acrpushv1' #this svc name should be there in azdo or it ll throw error
              keyVaultName: 'dolcegabbana' # the svc above should have the permission to view the secret

          - task: terraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest' # we are installing as the public azdo doesnt have it
          - script: |
              make init
              make plan
            env:
              ARM_CLIENT_ID: $(arm-client-id)
              ARM_CLIENT_SECRET: $(arm-client-secret)
              ARM_SUBSCRIPTION_ID: $(arm-subscription-id)
              ARM_TENANT_ID: $(arm-tenant-id)
            displayName: 'Set ARM environment variables'
             

           